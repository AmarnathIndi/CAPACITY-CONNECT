version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: capacity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imd_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-IMD_Secure_Pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-capacity_connect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imd_admin} -d ${POSTGRES_DB:-capacity_connect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - capacity_net

  redis:
    image: redis:7-alpine
    container_name: capacity_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-IMD_Redis_Secret_2026!}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-IMD_Redis_Secret_2026!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - capacity_net

  minio:
    image: minio/minio:latest
    container_name: capacity_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-imd_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-IMD_MinIO_Super_Pass_2026!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capacity_net

  minio-init:
    image: minio/mc:latest
    container_name: capacity_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-imd_minio_admin} ${MINIO_ROOT_PASSWORD:-IMD_MinIO_Super_Pass_2026!};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-imd-capacity-connect};
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET_NAME:-imd-capacity-connect};
      exit 0;
      "
    networks:
      - capacity_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: capacity_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web client
    networks:
      - capacity_net

  ollama:
    image: ollama/ollama:latest
    container_name: capacity_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - capacity_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capacity_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-imd_admin}:${POSTGRES_PASSWORD:-IMD_Secure_Pass_2026!}@postgres:5432/${POSTGRES_DB:-capacity_connect}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-IMD_Redis_Secret_2026!}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-imd_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-IMD_MinIO_Super_Pass_2026!}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-imd-capacity-connect}
      OLLAMA_BASE_URL: http://ollama:11434
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-IMD_Super_Secret_Jwt_Access_Key_Minimum_32_Chars_2026!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-IMD_Super_Secret_Jwt_Refresh_Key_Minimum_32_Chars_2026!}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capacity_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capacity_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - capacity_net

networks:
  capacity_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
